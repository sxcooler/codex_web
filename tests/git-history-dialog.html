<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/icon.svg"><title>Git history dialog QA</title>
<div id="root" class="git-panel" style="height:calc(100dvh - 24px);max-width:800px;margin:auto;display:flex;flex-direction:column"></div>
<script type="module">
