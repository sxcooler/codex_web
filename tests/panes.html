<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双侧栏布局回归</title><link rel="icon" href="/icon.svg"><div id="root"></div><output id="result" style="position:fixed;bottom:0;left:0;z-index:30;background:#111;padding:6px">RUNNING</output>
<!-- npm run dev, then open /tests/panes.html. No APIs. -->
<script type="module">
import React,{useEffect} from 'react';
import {createRoot} from 'react-dom/client';
import {PaneLayout,PaneToolbar,PaneSeparator,usePanes} from '/src/web/PaneLayout.tsx';
import '/src/web/style.css';
const h=React.createElement,root=createRoot(document.querySelector('#root'));
function Content(){const p=usePanes();useEffect(()=>{p.setRightAvailable(true);},[]);return h(React.Fragment,null,h('aside',{className:'sidebar',id:'left-sidebar'},h('button',null,'左栏内容')),h(PaneSeparator,{side:'left'}),h('div',{className:'workspace'},h('div',{className:'workspace-content'},h('div',{className:'session-layout '+(p.rightVisible?'with-git':'')},h('div',{className:'session-center'},h(PaneToolbar),h('main',{className:'session-main',inert:p.mobile&&p.drawer!==null},h('h1',null,'会话内容'),h('textarea',{defaultValue:'保留草稿'}))),h(PaneSeparator,{side:'right'}),h('aside',{className:'git-panel',id:'right-sidebar'},h('button',null,'右栏内容'))))));}
const render=key=>root.render(h(PaneLayout,{className:'shell',key},h(Content)));
const check=(v,m)=>{if(!v)throw Error(m)},wait=()=>new Promise(r=>setTimeout(r,80));
const button=side=>document.querySelector('[data-panel-toggle='+side+']'),open=side=>button(side).getAttribute('aria-expanded')==='true';
try{localStorage.removeItem('codex-web:panels:v1');render(1);await wait();const right=document.querySelector('.git-panel'),draft=document.querySelector('textarea');
 if(innerWidth>1000){const center=document.querySelector('.session-center').getBoundingClientRect(),toolbar=document.querySelector('.pane-toolbar').getBoundingClientRect(),rightBounds=document.querySelector('.git-panel').getBoundingClientRect();check(Math.abs(toolbar.right-center.right)<1&&toolbar.right<rightBounds.left,'折叠按钮工具栏跨入右侧栏');check(Math.abs(toolbar.top-rightBounds.top)<1,'右侧栏未独立占据顶部');check(open('left')&&open('right'),'Desktop defaults');const width=document.querySelector('.workspace').clientWidth;button('left').click();await wait();check(!open('left')&&document.querySelector('.workspace').clientWidth>width,'Collapsing left must reclaim space');button('right').click();await wait();check(!open('right')&&getComputedStyle(right).display==='none','Right must hide');check(right===document.querySelector('.git-panel')&&draft.value==='保留草稿','Collapse must preserve subtree');render(2);await wait();check(!open('left')&&!open('right'),'Reload layout must restore collapsed preferences');button('left').click();button('right').click();await wait();check(open('left')&&open('right'),'Both reopen');}
 else{check(!open('left')&&!open('right'),'Drawers initially closed');button('left').click();await wait();check(open('left')&&!open('right'),'Left drawer');button('right').click();await wait();check(!open('left')&&open('right'),'Drawers must be mutually exclusive');check(document.querySelector('.session-main').inert,'Background must be inert');window.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));await wait();check(!open('right')&&document.activeElement===button('right'),'Escape closes and restores focus');check(draft.value==='保留草稿','Drawer must preserve draft');}
 check(document.documentElement.scrollWidth<=innerWidth,'Page horizontal overflow');document.querySelector('#result').textContent='PASS: 双侧折叠 / 持久化 / 抽屉互斥 / 焦点 / 草稿';
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;console.error(e);}
</script></html>
