<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话顶栏与输入区回归</title><div id="root"></div>
<script type="module">
const deferModels=new URLSearchParams(location.search).has('deferModels');
const emptySync=new URLSearchParams(location.search).has('emptySync');
const attachmentBadge=new URLSearchParams(location.search).has('attachmentBadge');
history.replaceState(null,'','/sessions/toolbar-test');
window.testState={calls:[],holdRead:false,upload:null,released:false,snapshot:{thread:{id:'toolbar-test',name:'完善示例应用的帮助文档与快速入门说明',cwd:'C:\\demo\\demo-workspace',turns:[{id:'turn',status:'completed',items:Array.from({length:30},(_,i)=>({id:'message-'+i,type:'agentMessage',text:'演示消息 '+i+'\n\n'+('用于验证阅读位置和可用空间。'.repeat(15))}))}]},phase:'IDLE',pending:[]}};
const state=window.testState,response=(data,status=200)=>new Response(JSON.stringify(data),{status});
window.EventSource=class extends EventTarget{constructor(){super();state.stream=this;queueMicrotask(()=>this.dispatchEvent(new Event('ready')));}close(){}};
window.fetch=async(path,options={})=>{
 state.calls.push(String(path));
 if(path==='/api/auth/session')return response({authenticated:true,csrfToken:'test'});
 if(path==='/api/account/usage')return response({accountId:null});
 if(path==='/api/projects')return response({projects:[]});
 if(path==='/api/sessions')return response({data:[state.snapshot.thread,{id:'other',name:'另一演示会话'}]});
 if(path==='/api/models'){if(deferModels)return new Promise(resolve=>state.failModels=()=>resolve(response({error:'演示模型读取失败'},503)));return response({data:[{id:'demo',model:'demo',displayName:'演示模型',supportedReasoningEfforts:['high']}]});}
 if(path.startsWith('/api/permission-modes'))return response({current:'ask',modes:[{id:'ask',available:true},{id:'full-access',available:true}]});
 if(path==='/api/uploads')return new Promise(resolve=>{state.upload={signal:options.signal,finish:()=>resolve(response({uploadId:'mock-file',kind:'file'})),fail:()=>resolve(response({error:'上传失败示例'},503))};});
 if(path.endsWith('/release')){state.released=true;return response({handoffReady:true});}
 if(path.endsWith('/abort'))return response({});
 if(path.endsWith('/messages')){(state.messages??=[]).push(JSON.parse(options.body));if(state.unknownSend)throw Error('演示网络中断');return response({error:'演示提交失败'},409);}
 if(path.endsWith('/open'))return state.failOpen?response({error:'占用核对失败'},503):response({});
 if(path.endsWith('/cancel-release')||path.endsWith('/release-on-leave')||path.includes('/status?'))return response({});
 if(path==='/api/sessions/toolbar-test'){if(state.failRead)return response({error:'演示同步失败'},503);if(state.holdRead)await new Promise(resolve=>state.finishRead=resolve);return response(state.snapshot);}
 if(path==='/api/sessions/other')return response({thread:{id:'other',name:'另一演示会话',turns:[]},phase:'IDLE',pending:[]});
 throw Error('Unexpected API '+path);
};
await import('/src/web/main.tsx');
if(attachmentBadge){
 const result=document.body.appendChild(document.createElement('output'));result.id='result';result.textContent='RUNNING';
 const tick=()=>new Promise(r=>setTimeout(r,60)),check=(v,m)=>{if(!v)throw Error(m)},button=label=>document.querySelector(`[aria-label="${label}"]`),count=()=>document.querySelector('.attachment-count')?.textContent,height=()=>document.querySelector('.composer').getBoundingClientRect().height;
 const collapse=async()=>{button('收起输入区').click();await tick();},expand=async()=>{button('展开输入').click();await tick();};
 const add=async(name='测试.txt')=>{const data=new DataTransfer();data.items.add(new File(['x'],name,{type:'text/plain'}));const input=document.querySelector('.attachments input[type=file]');input.files=data.files;input.dispatchEvent(new Event('change',{bubbles:true}));await tick();};
 try{
  for(let i=0;i<100&&!button('收起输入区');i++)await tick();await tick();if(button('展开输入'))await expand();for(let i=0;i<5;i++){await add('附件'+i+'.txt');state.upload.finish();await tick();}await collapse();const baseline=height();
  check(count()==='5'&&!document.querySelector('.composer-compact'),'五个就绪附件撑高输入栏');check(button('添加附件').getAttribute('aria-description')==='已添加 5 个附件','缺少无障碍附件数量');
  await expand();for(let i=1;i<5;i++){button('移除附件 附件'+i+'.txt').click();await tick();}await collapse();check(count()==='1'&&height()===baseline,'一个附件改变高度');
  await expand();button('移除附件 附件0.txt').click();await tick();await collapse();check(!count()&&height()===baseline,'无附件改变高度或残留角标');
  await add();check(count()==='1'&&document.querySelector('.composer-compact')?.textContent.includes('上传中'),'上传中状态丢失');state.upload.fail();await tick();check(document.querySelector('.composer-compact')?.textContent.includes('上传失败')&&document.querySelector('.composer-actions .primary').disabled,'失败提示或发送保护丢失');
  await expand();button('移除附件 测试.txt').click();await tick();await collapse();await add();state.upload.finish();await tick();check(count()==='1'&&!document.querySelector('.composer-compact')&&height()===baseline,'上传就绪后未恢复单行');
  check(document.documentElement.scrollWidth<=innerWidth,'页面横向溢出');result.textContent='PASS';
 }catch(error){result.textContent='FAIL: '+error.message;throw error;}
}
if(emptySync){
 const result=document.body.appendChild(document.createElement('output'));result.id='result';result.textContent='RUNNING';
 const until=async(check)=>{const end=Date.now()+5000;while(!check()){if(Date.now()>end)throw Error('等待状态未出现');await new Promise(r=>setTimeout(r,25));}},check=(value,message)=>{if(!value)throw Error(message)},empty=()=>document.querySelector('.session-empty');
 const refresh=async()=>{document.querySelector('[aria-label="刷新当前会话"]').click();await until(()=>document.querySelector('[aria-label="刷新当前会话"]').getAttribute('aria-busy')==='false');await new Promise(r=>setTimeout(r,40));};
 try{
  await until(()=>document.querySelector('[aria-label="刷新当前会话"]')?.getAttribute('aria-busy')==='false');
  state.snapshot={...state.snapshot,phase:'RUNNING',activeTurnId:'turn',unmaterialized:true,thread:{...state.snapshot.thread,turns:[{id:'turn',status:'inProgress',items:[]}]}};await refresh();
  check(empty()?.textContent.includes('任务进行中，正在同步内容'),'活动任务被当成未发送');check(empty()?.querySelector('progress'),'等待缺少进度指示');check(!document.body.textContent.includes('输入第一条任务')&&!document.body.textContent.includes('发送首条消息后保存'),'仍有首次发送提示');
  state.snapshot={...state.snapshot,phase:'IDLE',activeTurnId:null,thread:{...state.snapshot.thread,turns:[]}};await refresh();
  check(empty()?.textContent==='暂无可显示的消息。'&&!empty()?.querySelector('progress'),'已读取的空结果仍在加载');
  state.failRead=true;await refresh();check(empty()?.textContent.includes('内容同步失败')&&!empty()?.querySelector('progress'),'失败仍显示加载');check(empty()?.querySelector('button')?.textContent==='重新同步','失败缺少恢复入口');
  state.failRead=false;state.snapshot={...state.snapshot,phase:'RUNNING',activeTurnId:'turn',thread:{...state.snapshot.thread,turns:[{id:'turn',status:'inProgress',items:[{id:'first',type:'userMessage',content:[{type:'text',text:'已经发出的任务'}]}]}]}};await refresh();
  check(!empty()&&document.querySelector('.timeline').textContent.includes('已经发出的任务'),'消息到达后未移除等待提示');
  state.snapshot.thread.turns[0].items=[];await refresh();result.textContent='PASS';
 }catch(error){result.textContent='FAIL: '+error.message;throw error;}
}
</script></html>
