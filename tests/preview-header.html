<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/icon.svg"><title>预览标题栏回归</title><div id="root" style="height:95dvh;max-width:650px;margin:auto"></div><style>#right-sidebar,.header-history{height:100%;max-height:none}.header-history>.git-history{height:100%}</style><script type="module">
import '/src/web/style.css';import React from 'react';import{createRoot}from'react-dom/client';import{GitPanel}from'/src/web/GitPanel.tsx';import{GitHistory}from'/src/web/GitHistory.tsx';
const root=createRoot(document.querySelector('#root'));
window.projectRoot='C:\\Users\\Developer\\work\\sample-project';window.longPath='.worktrees/temporal-pipeline-benchmark/docs/handoffs/2026-10-13-n0-cuda32-trt32-wide-table-results.md';window.requests=[];
const text=Array.from({length:70},(_,i)=>'## 段落 '+i+'\n\n'+('正文阅读与滚动位置保持。 '.repeat(12))).join('\n\n');
const diff={hunks:[{oldStart:1,newStart:1,oldLines:0,newLines:80,lines:Array.from({length:80},(_,i)=>({kind:'add',newLine:i+1,text:'changed line '+i}))}]};
window.fetch=async input=>{const url=new URL(String(input),location.origin);requests.push(url.pathname+url.search);if(url.pathname.endsWith('/files/entry'))return Response.json({path:url.searchParams.get('path'),type:'file'});if(url.pathname.endsWith('/files/content'))return Response.json({text});if(url.pathname.endsWith('/git/repositories'))return Response.json({repositories:[{path:'',kind:'main',available:true},{path:'vendor/sub',kind:'submodule',available:true}],complete:true});if(url.pathname.endsWith('/git/log'))return Response.json({commits:[{id:'c0',parents:[],subject:'header commit',author:'QA',date:'2026-10-13'}],branches:[]});if(url.pathname.endsWith('/git/commit'))return Response.json({commit:{id:'c0',parents:[],subject:'header commit'},files:[{path:'nested/file.txt'}]});if(url.pathname.endsWith('/diff'))return Response.json(diff);return Response.json({files:[{path:longPath,type:'file',status:'M'},{path:'short.md',type:'file',status:'M'}]});};
localStorage.clear();localStorage.setItem('codex.project-panel.header',JSON.stringify({tab:'files',files:{path:longPath}}));
window.renderPanel=(path=longPath)=>root.render(React.createElement(GitPanel,{id:'header',projectId:'header',projectRoot,visible:true,tick:0,openFile:{path}}));
function History({repository='',missingRoot=false}){const[state,setState]=React.useState({repository,ref:'HEAD',commit:'c0',path:'nested/file.txt',scroll:0,listScroll:0,pages:1,filesScroll:0,collapsed:true,filesCollapsed:true});return React.createElement(GitHistory,{id:'header',projectRoot:missingRoot?undefined:projectRoot,tick:0,visible:true,state,onChange:patch=>setState(old=>({...old,...patch}))});}
window.renderHistory=(repository='',missingRoot=false)=>root.render(React.createElement('aside',{className:'git-panel header-history'},React.createElement(History,{key:repository+missingRoot,repository,missingRoot})));
renderPanel();
</script></html>
