<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>项目面板回归</title>
<style>.git-panel{display:block;height:220px;overflow:auto}.file-list{height:60px;overflow:auto}.file-list>button{display:block}.file-preview pre{height:40px;overflow:auto}</style>
<div id="root"></div><output id="result">RUNNING</output>
<script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import{GitPanel}from'/src/web/GitPanel.tsx';import{MarkdownView}from'/src/web/MarkdownView.tsx';
const h=React.createElement,root=createRoot(document.querySelector('#root')),check=(v,m)=>{if(!v)throw Error(m)},tick=(ms=80)=>new Promise(r=>setTimeout(r,ms));
let failed=new Set(),requests=[],holdList=false,releaseList;const markdown='[child](child.txt)\n\n[space](guide%20one.md)\n\n[percent](guide%2520one.md)\n\n[hash](guide%23one.md)\n\n[reference][ref]\n\n[ref]: child.txt';
globalThis.fetch=async input=>{const url=String(input);requests.push(url);if(url.includes('/git/log'))return Response.json({repository:true,commits:Array.from({length:30},(_,i)=>({id:String(i).padStart(40,'0'),parents:i===29?[]:[String(i+1).padStart(40,'0')],subject:'Commit '+i,author:'QA',date:'2026-09-11T00:00:00Z',refs:[]})),branches:[],nextCursor:null});if(url.includes('/files?directory=')&&holdList)await new Promise(resolve=>{releaseList=resolve;});if(url.includes('/files?directory='))return Response.json({files:[{path:'photo.png',type:'file'},{path:'broken.png',type:'file'},{path:'note.txt',type:'file'},{path:'README.md',type:'file'},{path:'child.txt',type:'file'},{path:'missing.txt',type:'file'},...Array.from({length:20},(_,index)=>({path:'filler-'+index+'.txt',type:'file'}))]});if(url.includes('/files/content?path=')){const path=decodeURIComponent(url.split('path=')[1]);if(failed.has(path))return Response.json({error:'gone'},{status:404});return Response.json({text:path==='README.md'?markdown:path==='note.txt'?'old content':'child content'});}return Response.json({files:[]});};
let changes=[{path:'photo.png',status:'M',binary:true}],changesFail=false,fetchCalls=0,fetchHeld=false,finishFetch,logCalls=0,dataTick=0;
const baseFetch=globalThis.fetch,parent='1'.repeat(40),commit='2'.repeat(40);
globalThis.fetch=async (input,options)=>{
 const url=new URL(String(input),location.origin),query=url.searchParams;
 if(url.pathname.endsWith('/git/fetch')){fetchCalls++;check(options.method==='POST','fetch 必须是 POST');return fetchHeld?new Promise(resolve=>{finishFetch=value=>resolve(Response.json(value));}):Response.json({skipped:'no-remotes',remotes:[]});}
 if(url.pathname.endsWith('/git/log'))logCalls++;
 if(url.pathname.endsWith('/git/files'))return changesFail?Response.json({error:'offline'},{status:503}):Response.json({files:changes});
 if(url.pathname.endsWith('/git/diff'))return Response.json({images:{before:{path:'photo.png',revision:query.get('staged')==='true'?parent:'index'},after:{path:'photo.png',...(query.get('staged')==='true'?{revision:'index'}:{})}}});
 if(url.pathname.endsWith('/git/commit'))return Response.json({commit:{id:commit,parents:[parent],subject:'Image commit',author:'QA',date:'2026-09-11T00:00:00Z'},parent,files:[{path:'photo.png',status:'modified',binary:true},{path:'deleted.png',status:'deleted',binary:true}]});
 if(url.pathname.endsWith('/git/commit/diff'))return Response.json({images:{before:{path:query.get('path'),revision:parent},after:query.get('path')==='deleted.png'?null:{path:'photo.png',revision:commit}}});
 return baseFetch(input);
};
const render=(project='one',session='session')=>root.render(h(React.Fragment,null,h(MarkdownView,{text:'[Chat link](https://example.com)'}),h(GitPanel,{key:project,id:session,projectId:project,tick:dataTick,visible:true})));
const button=text=>[...document.querySelectorAll('button')].find(node=>node.textContent===text);
try{
 localStorage.clear();root.render(h(MarkdownView,{text:'[Chat link](https://example.com)'}));await tick(1200);render();await tick();button('文件').click();await tick();button('文件').click();await tick();check(button('文件').getAttribute('aria-pressed')==='true','重复点击重置标签');
 if(new URLSearchParams(location.search).has('fetch')){
 check(fetchCalls===0,'打开面板或切标签自动 fetch');dataTick++;render();await tick();check(fetchCalls===0,'会话事件自动 fetch');
 fetchHeld=true;const localReads=requests.length;button('↻ 刷新').click();button('↻ 刷新').click();await tick();check(fetchCalls===1&&button('↻ 刷新').disabled,'重复点击未合并');check(requests.length>localReads,'本地读取等待 fetch');
 button('note.txt').click();await tick();check(document.querySelector('.file-preview')?.textContent.includes('old content'),'fetch 期间无法读文件');button('Git 日志').click();await tick();const initialLogs=logCalls;check(!button('刷新日志'),'重复刷新按钮仍存在');check(fetchCalls===1,'切日志又发 fetch');
 finishFetch({remotes:[{name:'origin',status:'updated'},{name:'backup',status:'failed',error:'测试网络失败'}]});await tick();check(logCalls>initialLogs,'部分成功后未更新图谱');check(document.querySelector('.fetch-result[role=alert]')?.textContent.includes('backup'),'部分失败未提示');check(!button('↻ 刷新').disabled,'获取后按钮未恢复');
 button('文件').click();await tick();button('↻ 刷新').click();await tick();const finishOld=finishFetch;render('fetch-other','other-session');await tick();finishOld({remotes:[{name:'old-project',status:'failed',error:'旧项目失败'}]});await tick();check(!document.querySelector('.fetch-result'),'旧项目响应污染新项目');render();await tick();fetchHeld=false;button('文件').click();await tick();
 }
 if(new URLSearchParams(location.search).has('images')){
 button('photo.png').click();await tick(400);let picture=document.querySelector('.image-preview img');check(picture?.naturalWidth>0,'图片未加载');check(!requests.some(url=>url.includes('/files/content?path=photo.png')),'图片仍请求全文 JSON');const previous=picture.src;button('↻ 刷新').click();await tick(400);check(document.querySelector('.image-preview img')?.src!==previous,'刷新未更新图片请求');button('broken.png').click();await tick(400);check(document.querySelector('.image-preview [role=alert]'),'图片失败无提示');button('photo.png').click();await tick(400);check(document.querySelector('.image-preview img')?.naturalWidth>0&&!document.querySelector('.image-preview [role=alert]'),'换图后仍保留旧错误');
 button('变更').click();await tick();document.querySelector('.file-list button').click();await tick(400);
 const sources=()=>[...document.querySelectorAll('.image-diff img')].filter(img=>!img.closest('[hidden]')).map(img=>{check(img.naturalWidth>0,'版本图片未加载');return new URL(img.src).searchParams.get('revision');});
 check(JSON.stringify(sources())===JSON.stringify(['index',null]),'工作区图片版本错误');
 button('暂存区').click();await tick(400);check(JSON.stringify(sources())===JSON.stringify([parent,'index']),'暂存区图片版本错误');
 changesFail=true;button('↻ 刷新').click();await tick();check(document.querySelector('.file-preview h3')?.textContent==='photo.png','请求失败误清选中项');
 changesFail=false;changes=[];button('↻ 刷新').click();await tick();check(!document.querySelector('.file-preview h3'),'空变更列表仍残留文件预览');
 changes=[{path:'photo.png',status:'M',binary:true}];button('工作区').click();await tick();document.querySelector('.file-list button').click();await tick(400);
 button('Git 日志').click();await tick();document.querySelector('.git-commit').click();await tick();document.querySelector('.commit-details .file-list button').click();await tick(400);
 check(JSON.stringify(sources())===JSON.stringify([parent,commit]),'Git 历史未使用提交版本');
 document.querySelectorAll('.commit-details .file-list button')[1].click();await tick(400);check(JSON.stringify(sources())===JSON.stringify([parent]),'历史删除图片版本错误');check(document.querySelector('.commit-details .image-diff')?.textContent.includes('已删除'),'删除版本无说明');
 const branch=document.querySelector('[aria-label="Git 分支"]');branch.value='all';branch.dispatchEvent(new Event('change',{bubbles:true}));await tick();button('文件').click();await tick();
 }
 button('note.txt').click();await tick();check(document.querySelector('.file-preview')?.textContent.includes('old content'),'初次正文缺失');
 failed.add('note.txt');button('↻ 刷新').click();await tick();check(document.querySelector('.file-preview')?.textContent.includes('old content')&&document.querySelector('.file-preview [role=alert]'),'同资源失败未保留旧正文');
 failed.add('missing.txt');button('missing.txt').click();await tick();check(document.querySelector('.file-preview [role=alert]')?.textContent.includes('文件已不可用')&&!document.querySelector('.file-preview')?.textContent.includes('读取文件'),'新资源失败仍无限加载');
 failed.delete('README.md');button('README.md').click();await tick(1200);document.querySelector('.file-preview .markdown-message a')?.click();await tick();check(document.querySelector('.file-preview h3')?.textContent==='child.txt','相对链接未留在文件面板');
 for(const [label,expected] of [['space','guide one.md'],['percent','guide%20one.md'],['hash','guide#one.md'],['reference','child.txt']]){button('README.md').click();await tick();[...document.querySelectorAll('.file-preview a')].find(a=>a.textContent===label)?.click();await tick();check(document.querySelector('.file-preview h3')?.textContent===expected,'编码或引用链接错误: '+label);check(requests.some(url=>url.endsWith('path='+encodeURIComponent(expected))),'错误请求路径: '+expected);}
 button('README.md').click();await tick();button('源码').click();await tick();check(document.querySelector('.file-preview pre')?.textContent===markdown,'文件源码被链接处理改写');
 holdList=true;button('↻ 刷新').click();await tick();button('Git 日志').click();await tick();holdList=false;releaseList();await tick();check(!button('↻ 刷新').disabled,'切日志后刷新按钮仍禁用');
 const panel=document.querySelector('#right-sidebar');panel.scrollTop=180;await tick();check(JSON.parse(localStorage.getItem('codex.project-panel.one')).history.scroll===180,'日志未保存滚动');button('文件').click();await tick();button('Git 日志').click();await tick();check(panel.scrollTop===180,'日志标签切换丢失滚动');root.render(null);await tick();render();await tick();check(document.querySelector('#right-sidebar').scrollTop===180,'日志重载未恢复异步内容滚动');button('文件').click();await tick();
 root.render(null);await tick();const saved=JSON.parse(localStorage.getItem('codex.project-panel.one'));saved.files.listScroll=17;localStorage.setItem('codex.project-panel.one',JSON.stringify(saved));render();await tick();check(button('文件').getAttribute('aria-pressed')==='true','重开未恢复标签');check(document.querySelector('.file-list').scrollTop===17,'重开未恢复列表滚动');
 render('two');await tick();check(button('变更').getAttribute('aria-pressed')==='true','项目状态串线');
 document.querySelector('#result').textContent='PASS: 标签 / 日志和文件滚动 / 加载中切换 / 失败保留 / 文件消失 / 编码与引用链接 / 原文 / 项目隔离';
}catch(error){document.querySelector('#result').textContent='FAIL: '+error.message;console.error(error);}
</script></html>
