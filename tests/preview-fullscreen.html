const root=createRoot(document.querySelector('#root'));window.requests=0;window.workers=0;window.tasks=0;const WorkerBase=window.Worker;window.Worker=class extends WorkerBase{constructor(...args){super(...args);window.workers++;}postMessage(...args){window.tasks++;return super.postMessage(...args);}};

window.fetch=async input=>{window.requests++;const u=new URL(String(input),location.origin),path=u.searchParams.get('path');if(u.pathname.endsWith('/files/entry'))return Response.json({path,type:'file'});if(u.pathname.endsWith('/files/content')){if(path==='slow.md')await new Promise(r=>window.releaseRead=r);if(path==='missing.md')return Response.json({error:'gone'},{status:404});return Response.json({text:path==='reading.md'?readingText:path?.endsWith('.ts')?Array.from({length:400},(_,i)=>'const value'+i+' = '+i+'; // '+ 'long source line '.repeat(30)).join('\n'):text});}if(u.pathname.endsWith('/git/repositories'))return Response.json({repositories:[{path:'',available:true,kind:'main'}],complete:true});if(u.pathname.endsWith('/git/log'))return Response.json({commits:[{id:'abc',parents:[],subject:'commit',author:'QA',date:'2026-10-11'}],branches:[]});if(u.pathname.endsWith('/git/commit'))return Response.json({commit:{id:'abc',subject:'commit',parents:[]},files:[{path:'example.ts'}]});if(u.pathname.endsWith('/diff'))return Response.json(diff);return Response.json({files:[{path:'README.md',type:'file'},{path:'example.ts',type:'file'},{path:'photo.png',type:'file'},{path:'slow.md',type:'file'},{path:'missing.md',type:'file'},{path:'reading.md',type:'file'}]});};
localStorage.clear();localStorage.setItem('codex.project-panel.fullscreen',JSON.stringify({tab:'files',files:{path:'README.md'}}));window.renderPanel=(visible=true,id='full',projectId='fullscreen')=>root.render(React.createElement(GitPanel,{id,projectId,visible,tick:0}));renderPanel();
function Drawer(){const panes=usePanes();React.useEffect(()=>panes.setRightAvailable(true),[]);return React.createElement(React.Fragment,null,React.createElement(PaneToolbar),React.createElement(GitPanel,{id:'drawer',projectId:'fullscreen',visible:panes.rightVisible,tick:0}));}window.renderDrawer=()=>root.render(React.createElement(PaneLayout,{className:'shell'},React.createElement(Drawer)));
