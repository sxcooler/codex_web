<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史分页与按需输出回归</title><div id="root"></div><output id="result" style="position:fixed;bottom:0;right:0;z-index:100;background:#111">RUNNING</output>
<script type="module">
const id='performance-test',epoch='performance-epoch',sources=[];let reads=0,pages=0,outputs=0,failOutput=true,hold=false,finishPage,reportPayload;
const large='完整命令输出\n'.repeat(30000),cmd=(n)=>({id:'cmd'+n,type:'commandExecution',command:'command '+n,status:'completed',exitCode:0,aggregatedOutput:large.slice(0,2048),outputDeferred:true,outputChars:large.length,outputBytes:new TextEncoder().encode(large).length});
const turns=Array.from({length:45},(_,n)=>({id:'turn'+(n+1),status:n===44?'inProgress':'completed',items:[{id:'answer'+(n+1),type:'agentMessage',text:'消息 '+(n+1)+'\n\n'+'用于验证历史阅读位置。'.repeat(30)},...(n===38||n===39?[cmd(n+1)]:[])]}));
let snapshot={thread:{id,name:'性能测试',turns:turns.slice(-3)},history:{nextCursor:'turn43'},phase:'RUNNING',activeTurnId:'turn45',pending:[],epoch,revision:0,syncCursor:epoch+':0'};
const response=(data,status=200)=>new Response(JSON.stringify(data),{status});
const check=(value,message)=>{if(!value)throw Error(message)},pause=()=>new Promise(r=>setTimeout(r,60));async function until(predicate,message){const end=Date.now()+12000;while(!predicate()){if(Date.now()>end)throw Error(message);await pause();}}
const button=text=>[...document.querySelectorAll('button')].find(node=>node.textContent===text),active=()=>sources.findLast(s=>!s.closed),body=()=>document.querySelector('.timeline')?.textContent??'';
window.EventSource=class extends EventTarget{constructor(url){super();sources.push(this);queueMicrotask(()=>this.dispatchEvent(new Event('ready')));}close(){this.closed=true;}};
window.fetch=async(raw,options={})=>{const path=String(raw);if(path==='/api/auth/session')return response({authenticated:true,csrfToken:'test'});if(path==='/api/projects')return response({projects:[]});if(path==='/api/models')return response({data:[]});if(path.startsWith('/api/permission-modes'))return response({modes:[]});if(path==='/api/sessions')return response({data:[{id,name:'性能测试'}],nextCursor:null});if(path==='/api/sessions/'+id){reads++;return response(structuredClone(snapshot));}if(path.includes('/history?')){pages++;const cursor=new URL(path,location.origin).searchParams.get('before'),end=turns.findIndex(turn=>turn.id===cursor),start=Math.max(0,end-20),page={turns:structuredClone(turns.slice(start,end)),nextCursor:start?turns[start].id:null};return hold?new Promise(resolve=>finishPage=()=>resolve(response(page))):response(page);}if(path.endsWith('/output')){outputs++;if(path.includes('/cmd39/')&&failOutput){failOutput=false;return response({error:'模拟读取失败'},503);}return response({output:large});}if(path.endsWith('/test-reports')){reportPayload=JSON.parse(options.body);return response({summary:{passed:1,failed:0,skipped:0,errors:0},source:{relativePath:reportPayload.relativePath},cases:[]});}if(path.includes('/status?'))return response({resync:false});if(path.endsWith('/open')||path.endsWith('/cancel-release')||path.endsWith('/release-on-leave'))return response({});throw Error('Unexpected '+path);};
history.replaceState(null,'','/sessions/'+id);
try{
 await import('/src/web/main.tsx');await until(()=>active()&&body().includes('消息 45'),'初始窗口');check(document.querySelectorAll('.message').length===3,'首屏未限制为三轮');check(!body().includes('消息 42\n'),'初始加载旧历史');check(outputs===0,'折叠命令提前加载全文');
 button('加载更早消息').click();await until(()=>body().includes('消息 23')&&!button('正在加载更早消息…'),'首屏后的历史页');check(pages===1&&document.querySelectorAll('.message').length===23,'首屏三轮后的分页遗漏或重复');
 for(const group of document.querySelectorAll('.execution-process'))group.querySelector('summary').click();await until(()=>document.querySelectorAll('.command-step').length===2,'展开过程未显示步骤');check(outputs===0,'展开过程提前请求输出');
 const commands=()=>[...document.querySelectorAll('.command-step')],success=()=>commands().find(node=>node.querySelector('.step-heading code')?.textContent==='command 40');success().querySelector('.step-toggle').click();await until(()=>success().querySelector('pre:not(.command-source)')?.textContent===large,'展开未加载原文');check(outputs===1,'展开重复加载');const reportForm=success().querySelector('.test-report form'),reportInput=reportForm.querySelector('input');reportInput.value='test-results/junit.xml';reportInput.dispatchEvent(new Event('input',{bubbles:true}));reportForm.requestSubmit();await until(()=>reportPayload,'测试报告未提交');check(reportPayload.turnId==='turn40'&&reportPayload.commandItemId==='cmd40','测试报告未携带轮次或命令 ID');success().querySelector('.step-toggle').click();await pause();success().querySelector('.step-toggle').click();await pause();check(outputs===1,'重开未复用输出');
 const failure=commands().find(node=>node.querySelector('.step-heading code')?.textContent==='command 39');failure.querySelector('.step-toggle').click();await until(()=>button('重试加载输出'),'失败未提供重试');button('重试加载输出').click();await until(()=>failure.querySelector('pre:not(.command-source)')?.textContent===large,'重试未加载原文');check(outputs===3,'输出请求数错误');
 success().querySelector('.step-toggle').click();failure.querySelector('.step-toggle').click();await pause();const timeline=document.querySelector('.timeline');timeline.scrollTop=0;timeline.dispatchEvent(new Event('scroll'));const anchor=[...document.querySelectorAll('.message')].find(node=>node.textContent.includes('消息 23')),top=anchor.getBoundingClientRect().top;
 hold=true;button('加载更早消息').click();await until(()=>finishPage,'分页未发起');snapshot.revision=1;snapshot.syncCursor=epoch+':1';const item=turns[44].items[0],offset=item.text.length;item.text+='运行中增量';active().dispatchEvent(new MessageEvent('change',{data:JSON.stringify({id:snapshot.syncCursor,threadId:id,kind:'delta',revision:1,patch:{delta:{turnId:'turn45',itemId:item.id,field:'text',offset,text:'运行中增量'}}})}));hold=false;finishPage();await until(()=>body().includes('消息 3')&&!button('正在加载更早消息…'),'分页未显示');check(body().includes('运行中增量'),'分页覆盖实时消息');check(Math.abs(anchor.getBoundingClientRect().top-top)<5,'加载历史跳动阅读位置');
 timeline.scrollTop=0;timeline.dispatchEvent(new Event('scroll'));button('加载更早消息').click();await until(()=>body().includes('消息 1')&&!button('加载更早消息'),'最后历史页');check(document.querySelectorAll('.message').length===45,'历史重复或遗漏');check(reads===1&&pages===3,'分页触发全量快照');
 document.querySelector('[aria-label="刷新当前会话"]').click();await until(()=>reads===2&&button('加载更早消息'),'刷新窗口');hold=true;finishPage=undefined;button('加载更早消息').click();await until(()=>finishPage,'陈旧分页未发起');document.querySelector('[aria-label="刷新当前会话"]').click();await until(()=>reads===3&&!document.querySelector('[aria-label="刷新当前会话"]').textContent.includes('刷新中'),'刷新未完成');finishPage();await pause();check(document.querySelectorAll('.message').length===3,'陈旧分页污染新基线');
 document.querySelector('#result').textContent='PASS: 首屏3轮 / 历史20轮一页 / 历史无遗漏 / 保持阅读位置 / 增量不被覆盖 / 输出展开与缓存重试 / 过期分页丢弃';
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;console.error(e);}
</script></html>
