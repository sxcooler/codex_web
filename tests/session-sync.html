<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="/icon.svg"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话增量同步回归</title><div id="root"></div><output id="result" style="position:fixed;bottom:0;right:0;z-index:100;background:#111">RUNNING</output>
<script type="module">
const id='sync-test',epoch='sync-epoch',events=[],sources=[];let reads=0,statusReads=0,hold=false,finishRead;
let snapshot={thread:{id,name:'同步测试',model:'m',reasoningEffort:'high',turns:[{id:'old',status:'completed',items:[{id:'old-output',type:'commandExecution',command:'old command',aggregatedOutput:'old history '.repeat(400000),status:'completed'}]},{id:'turn',status:'inProgress',items:[{id:'answer',type:'agentMessage',text:'增量：'}]}]},phase:'RUNNING',activeTurnId:'turn',pending:[],epoch,revision:0,syncCursor:epoch+':0'};
const response=data=>new Response(JSON.stringify(data),{status:200});
const check=(v,m)=>{if(!v)throw Error(m)},pause=()=>new Promise(r=>setTimeout(r,50));async function until(predicate,message){const end=Date.now()+12000;while(!predicate()){if(Date.now()>end)throw Error(message);await pause();}}
const active=()=>sources.findLast(s=>!s.closed);
window.EventSource=class extends EventTarget{constructor(url){super();this.url=url;sources.push(this);queueMicrotask(()=>{const cursor=new URL(url,location.origin).searchParams.get('cursor');for(const event of events)if(event.revision>Number(cursor?.split(':').at(-1)??-1)&&!this.closed)this.dispatchEvent(new MessageEvent('change',{data:JSON.stringify(event)}));if(!this.closed)this.dispatchEvent(new Event('ready'));});}close(){this.closed=true;}};
window.fetch=async raw=>{const path=String(raw);if(path==='/api/auth/session')return response({authenticated:true,csrfToken:'test'});if(path==='/api/projects')return response({projects:[]});if(path==='/api/models')return response({data:[]});if(path.startsWith('/api/permission-modes'))return response({modes:[]});if(path==='/api/sessions')return response({data:[{id,name:'同步测试'}],nextCursor:null});if(path==='/api/sessions/'+id){reads++;const body=structuredClone(snapshot);return hold?new Promise(resolve=>finishRead=()=>resolve(response(body))):response(body);}if(path.startsWith('/api/sessions/'+id+'/status?')){statusReads++;return response({resync:false});}if(path.endsWith('/cancel-release')||path.endsWith('/release-on-leave'))return response({});throw Error('Unexpected '+path);};
const emit=(patch,deliver=true)=>{snapshot.revision++;snapshot.syncCursor=epoch+':'+snapshot.revision;const event={id:snapshot.syncCursor,threadId:id,kind:'delta',revision:snapshot.revision,patch};events.push(event);if(deliver)active()?.dispatchEvent(new MessageEvent('change',{data:JSON.stringify(event)}));return event;};
const append=(text,deliver=true)=>{const item=snapshot.thread.turns[1].items[0],offset=item.text.length;item.text+=text;return emit({delta:{turnId:'turn',itemId:'answer',field:'text',offset,text}},deliver);};
const body=()=>[...document.querySelectorAll('.message:not(.user)')].map(node=>node.textContent).join('');
history.replaceState(null,'','/sessions/'+id);
try{
 await import('/src/web/main.tsx');await until(()=>active()&&body().includes('增量：'),'Initial baseline');check(reads===1,'首次连接重复读取历史');
 for(let n=0;n<100;n++)append('字');await until(()=>body().includes('字'.repeat(100)),'Streaming content missing');check(reads===1,'增量触发全量 GET');
 const last=events.at(-1);active().dispatchEvent(new MessageEvent('change',{data:JSON.stringify(last)}));active().dispatchEvent(new Event('ready'));active().dispatchEvent(new Event('ping'));await pause();check(!body().includes('字'.repeat(101))&&reads===1,'重复事件或心跳触发重复内容/全量读取');
 window.dispatchEvent(new Event('focus'));await until(()=>statusReads>0,'Focus status check');check(reads===1,'聚焦重复下载历史');
 hold=true;document.querySelector('[aria-label="刷新当前会话"]').click();await until(()=>finishRead,'Manual refresh missing');append('刷新期间',false);hold=false;finishRead();await until(()=>body().includes('刷新期间'),'Baseline replay lost data');check(reads===2,'水位续传应只刷新一次');
 append('缺口前',false);append('缺口后');await until(()=>reads===3&&body().includes('缺口前缺口后'),'Gap did not recover baseline');
 snapshot.thread.turns[1].items[0].text='最终文本';emit({item:{turnId:'turn',item:{id:'answer',type:'agentMessage',text:'最终文本'},completed:true}});snapshot.phase='IDLE';snapshot.activeTurnId=null;snapshot.thread.turns[1].status='completed';emit({turn:{id:'turn',status:'completed',items:[]},state:{phase:'IDLE',activeTurnId:null,pending:[],error:null}});await until(()=>body().includes('最终文本')&&[...document.querySelectorAll('button')].some(b=>b.textContent==='发送'),'Terminal item/state missing');check(reads===3,'完成事件重新下载历史');
 check(JSON.stringify(events).length<50000,'增量携带了旧历史');document.querySelector('#result').textContent='PASS: 4.8 MB 历史 / 100 次增量仅首次 GET / 重复事件 / 轻量聚焦 / 快照续传 / 缺口恢复 / 终态';
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;console.error(e);}
</script></html>
