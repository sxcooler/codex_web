<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git 历史交互回归</title><link rel="icon" href="/icon.svg"><div id="root" style="max-width:650px;margin:auto;height:calc(100dvh - 40px)"></div><output id="result" style="position:fixed;bottom:0;left:0;background:#111;padding:6px">RUNNING</output>
<!-- npm run dev, open /tests/git-history.html. Fake API, real history component. -->
<script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import {GitHistory} from '/src/web/GitHistory.tsx';import '/src/web/style.css';
const root=createRoot(document.querySelector('#root')),h=React.createElement;
const commits=Array.from({length:20},(_,i)=>({id:String(i+1).repeat(40),parents:i<19?[String(i+2).repeat(40)]:[],subject:'提交 '+(i+1),author:'测试',date:'2026-09-11T00:00:00Z',refs:[]}));
commits[0].refs=['refs/heads/main'];commits[1].refs=['refs/remotes/origin/HEAD','refs/remotes/origin/main','refs/tags/v0.1.1'];
let revision=0;let state={ref:'HEAD',commit:'',parent:'',path:'',scroll:0,listScroll:0,pages:1},visible=true,failDiff=false,holdDetail=false,finishDetail,logCalls=0;
const response=(value,status=200)=>new Response(JSON.stringify(value),{status,headers:{'content-type':'application/json'}});
window.fetch=async raw=>{const url=new URL(raw,location.origin);if(url.pathname.endsWith('/git/log')){++logCalls;return response({repository:true,commits:url.searchParams.has('cursor')?commits.slice(2):commits.slice(0,2),branches:[],nextCursor:url.searchParams.has('cursor')?null:'next'});}if(url.pathname.endsWith('/git/commit/diff'))return failDiff?response({error:'差异更新失败'},503):response({hunks:[{oldStart:1,oldLines:0,newStart:1,newLines:1,lines:[{kind:'add',newLine:1,text:'committed content'}]}]});if(url.pathname.endsWith('/git/commit')){const commit=commits.find(c=>c.id===url.searchParams.get('commit')),value={commit:{...commit,message:commit.subject},parent:commit.parents[0]??null,files:[{path:'README.md',status:'M'}]};return holdDetail?new Promise(resolve=>finishDetail=()=>resolve(response(value))):response(value);}throw Error(raw);};
const render=()=>root.render(h('div',{hidden:!visible,style:{height:'100%',display:visible?'flex':'none',flexDirection:'column'}},h('button',{onClick:()=>{revision++;render();}},'\u5237\u65b0'),h(GitHistory,{id:'test',tick:revision,visible,state,onChange:next=>{state=next;render();}})));
const baseFetch=window.fetch;let selectedRef='';window.fetch=async raw=>{const url=new URL(raw,location.origin);const result=await baseFetch(raw);if(!url.pathname.endsWith('/git/log'))return result;selectedRef=url.searchParams.get('ref');return response({...await result.json(),branches:[{name:'main',ref:'refs/heads/main',current:true},{name:'origin/main',ref:'refs/remotes/origin/main',current:false}]});};
const check=(value,message)=>{if(!value)throw Error(message)},pause=()=>new Promise(r=>setTimeout(r,60));
async function until(test,message){const end=Date.now()+6000;while(!test()){if(Date.now()>end)throw Error(message);await pause();}}
const button=text=>[...document.querySelectorAll('button')].find(b=>b.textContent===text);
try{render();await until(()=>document.querySelectorAll('.git-commit').length===2,'First page');button('加载更早的 100 条').click();await until(()=>document.querySelectorAll('.git-commit').length===commits.length,'Second page');check(logCalls===2,'Load more must request only next page');check(document.querySelector('.git-ref.remote')?.textContent==='origin/HEAD','Remote label missing');check(document.querySelector('.git-ref.local')?.textContent==='main','Local label missing');check(document.querySelector('.git-ref.tag')?.textContent==='v0.1.1','Tag label missing');check(document.querySelector('option[value="refs/remotes/origin/main"]')?.textContent==='origin/main','Remote selector missing');
 for(const badge of document.querySelectorAll('.git-ref')){const icon=badge.querySelector('svg').getBoundingClientRect(),range=document.createRange();range.selectNode(badge.lastChild);const label=range.getBoundingClientRect();check(icon.right<=label.left+1&&Math.abs((icon.top+icon.bottom-label.top-label.bottom)/2)<3,'Ref icon and name must stay inline');}
 const list=document.querySelector('.git-graph-list');check(list.clientHeight<=innerHeight*.35+1&&list.scrollHeight>list.clientHeight,'日志列表必须限制高度并独立滚动');check(document.body.textContent.includes('选择一条提交'),'缺少详情提示');list.scrollTop=100;await pause();check(state.listScroll===100,'列表滚动未保存');
 visible=false;render();await pause();visible=true;render();await pause();check(document.querySelectorAll('.git-commit').length===commits.length&&logCalls===2,'Reopen must keep pages without duplicate request');check(list.scrollTop===100,'折叠后列表滚动丢失');
 document.querySelector('.git-commit').click();await until(()=>document.querySelector('.commit-details h3')?.textContent==='提交 1','First detail');check(document.querySelector('.commit-details').getBoundingClientRect().top<innerHeight,'提交详情未直接可见');document.querySelector('.commit-details .file-list button').click();await until(()=>document.querySelector('.diff-view')?.textContent.includes('committed content'),'Diff');
 failDiff=true;button('\u5237\u65b0').click();await until(()=>document.body.textContent.includes('差异更新失败'),'Refresh error missing');check(document.querySelector('.diff-view')?.textContent.includes('committed content'),'Refresh failure must retain same-resource content');await until(()=>document.querySelector('.git-history').getAttribute('aria-busy')==='false','Refresh did not finish');check(document.querySelectorAll('.git-commit').length===commits.length&&logCalls===4,'Refresh must replace pages without duplicates');
 holdDetail=true;document.querySelectorAll('.git-commit')[1].click();await until(()=>finishDetail,'New detail request');check(!document.querySelector('.commit-details h3')&&!document.querySelector('.diff-view'),'Old detail/diff leaked under new selection');finishDetail();await until(()=>document.querySelector('.commit-details h3')?.textContent==='提交 2','New detail');
 check(document.querySelectorAll('.git-graph circle').length===commits.length,'Graph nodes missing');root.render(null);await pause();render();await until(()=>document.querySelectorAll('.git-commit').length===commits.length,'Reload list');await pause();check(document.querySelector('.git-graph-list').scrollTop===100,'重开列表滚动丢失');const select=document.querySelector('[aria-label="Git \u5206\u652f"]');select.value='refs/remotes/origin/main';select.dispatchEvent(new Event('change',{bubbles:true}));await until(()=>selectedRef==='refs/remotes/origin/main','Remote selection did not request its ref');document.querySelector('#result').textContent='PASS: 限高 / 详情可见 / 独立滚动恢复 / 分页 / 折叠保留 / 刷新失败 / 资源隔离 / 图谱';
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;console.error(e);}
</script></html>
