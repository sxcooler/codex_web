<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git 仓库交互回归</title><style>#root{max-width:650px;margin:auto}#right-sidebar{height:calc(100dvh - 60px)}</style><div class="shell" style="display:block"><div id="root"></div></div><output id="result">RUNNING</output>
<script type="module">
import '/src/web/style.css';import React from 'react';import{createRoot}from'react-dom/client';import{GitPanel}from'/src/web/GitPanel.tsx';
const root=createRoot(document.querySelector('#root')),h=React.createElement,check=(value,message)=>{if(!value)throw Error(message)},pause=()=>new Promise(resolve=>setTimeout(resolve,30));
async function until(test,message){const end=Date.now()+6000;while(!test()){if(Date.now()>end)throw Error(message);await pause();}}
const commit='1'.repeat(40),parent='2'.repeat(40),requests=[];let tick=0,complete=true,hold='',pending=[];
let repositories=[{path:'',name:'project',kind:'main',available:true},{path:'sdk',name:'sdk',kind:'submodule',available:true},{path:'tools/sdk',name:'sdk',kind:'nested',available:true},{path:'uninitialized',name:'uninitialized',kind:'submodule',available:false,reason:'子模块尚未初始化'}];
window.fetch=async(input,options)=>{
 const url=new URL(input,location.origin),repo=url.searchParams.get('repository')??'',route=url.pathname.split('/').at(-1),body=options.body?JSON.parse(options.body):undefined;requests.push({route,repo,query:Object.fromEntries(url.searchParams),body});
 let data;
 if(route==='repositories')data={repositories,complete};
 else if(route==='log')data={repository:true,commits:[{id:url.searchParams.has('cursor')?'3'.repeat(40):commit,parents:[parent],subject:(repo||'main')+' commit',author:'QA',date:'2026-10-08T00:00:00Z',refs:[]}],branches:[{ref:'refs/heads/'+(repo||'main'),name:repo||'main'}],nextCursor:url.searchParams.has('cursor')?null:'next'};
 else if(route==='commit')data={commit:{id:commit,parents:[parent,'3'.repeat(40)],subject:(repo||'main')+' detail',message:'message',author:'QA',date:'2026-10-08T00:00:00Z'},parent:url.searchParams.get('parent'),files:[{path:'README.md',added:1,deleted:0},{path:'image.png',binary:true}]};
 else if(route==='diff')data=url.searchParams.get('path')==='image.png'?{images:{before:{path:'image.png',revision:parent},after:{path:'image.png',revision:commit}}}:{hunks:[{oldStart:1,oldLines:0,newStart:1,newLines:1,lines:[{kind:'add',newLine:1,text:(repo||'main')+' content'}]}]};
 else if(route==='fetch')data={remotes:[{name:'origin',status:'updated'}]};
 else data={files:[{path:'file.txt',type:'file'}],text:'main file'};
 const result=()=>Response.json(data);
 return hold===route+'|'+(body?.repository??repo)?new Promise(resolve=>pending.push(()=>resolve(result()))):result();
};
const render=()=>root.render(h(GitPanel,{id:'repository-test',projectId:'repository-test',tick,visible:true}));
const button=text=>[...document.querySelectorAll('button')].find(node=>node.textContent===text);
const choose=(label,value)=>{const select=document.querySelector('[aria-label="'+label+'"]');check(select,'Missing '+label);select.value=value;select.dispatchEvent(new Event('change',{bubbles:true}));};
const saved=()=>JSON.parse(localStorage.getItem('codex.project-panel.repository-test'));
const visibleText=()=>[...document.querySelectorAll('.fetch-result')].filter(node=>!node.closest('[hidden]')).map(node=>node.textContent).join('');
async function selectCommit(){document.querySelector('.git-commit').click();await until(()=>document.querySelector('.commit-metadata h3'),'Missing detail');}
async function selectText(repo){button('README.md+1 −0').click();await until(()=>document.querySelector('.diff-view')?.textContent.includes((repo||'main')+' content'),'Wrong repository diff');}
try{
 if(new URLSearchParams(location.search).has('restore')){render();await until(()=>document.querySelector('[aria-label="Git 仓库"]')?.value==='sdk'&&document.querySelector('.git-commit')?.textContent.includes('sdk commit'),'Full page reload lost repository');check(!requests.some(request=>request.route==='fetch'),'Reload fetched remote');document.querySelector('#result').textContent='PASS: 页面重载恢复仓库';}else{
 localStorage.removeItem('codex.project-panel.repository-test');localStorage.setItem('codex.project-panel.repository-test',JSON.stringify({tab:'history',history:{ref:'HEAD'}}));render();
 await until(()=>document.querySelector('[aria-label="Git 仓库"]'),'Repository selector missing');
 check(requests.every(request=>request.route!=='fetch'),'Opening history fetched remote');
 const unavailable=document.querySelector('option[value="uninitialized"]');check(unavailable.disabled&&unavailable.textContent.includes('尚未初始化'),'Unavailable reason missing');check(document.querySelector('option[value="tools/sdk"]').textContent.includes('tools/sdk'),'Duplicate repo names ambiguous');
 choose('Git 分支','all');await until(()=>requests.some(request=>request.query.ref==='all'),'Branch request missing');await until(()=>button('加载更早的 100 条'),'More history missing');button('加载更早的 100 条').click();await until(()=>saved().history.pages===2,'Page count missing');
 choose('Git 仓库','sdk');await until(()=>document.querySelector('.git-commit')?.textContent.includes('sdk commit'),'SDK log missing');check(saved().history.ref==='HEAD'&&saved().history.pages===1&&!saved().history.commit&&!saved().history.path,'Repository switch did not reset history');
 check(!document.querySelector('option[value="refs/heads/main"]'),'Old branches leaked');await selectCommit();await selectText('sdk');
 button('查看提交信息').click();choose('比较父提交','3'.repeat(40));await until(()=>requests.some(request=>request.route==='commit'&&request.repo==='sdk'&&request.query.parent==='3'.repeat(40)),'Parent lost repository');document.querySelector('.commit-info-close').click();await until(()=>button('image.png二进制'),'Files after parent missing');
 button('image.png二进制').click();await until(()=>document.querySelectorAll('.image-diff img').length===2&&[...document.querySelectorAll('.image-diff img')].every(img=>img.naturalWidth>0),'Image diff missing');check([...document.querySelectorAll('.image-diff img')].every(img=>new URL(img.src).searchParams.get('repository')==='sdk'),'Historical images lost repository');
 choose('Git 仓库','');await until(()=>document.querySelector('.git-commit')?.textContent.includes('main commit'),'Main log missing');check(!document.querySelector('.commit-metadata h3')&&!document.querySelector('.image-diff'),'Old detail/image persisted after switch');await selectCommit();await selectText('');
 choose('Git 仓库','sdk');await until(()=>document.querySelector('.git-commit')?.textContent.includes('sdk commit'),'SDK reopen');await selectCommit();await selectText('sdk');check(document.querySelector('.commit-metadata h3').textContent==='sdk detail','Shared commit hash reused wrong detail cache');
 hold='log|sdk';tick++;render();await until(()=>pending.length,'Held log missing');choose('Git 仓库','tools/sdk');await until(()=>document.querySelector('.git-commit')?.textContent.includes('tools/sdk commit'),'Nested log missing');hold='';pending.splice(0).forEach(finish=>finish());await pause();check(document.querySelector('.git-commit').textContent.includes('tools/sdk commit'),'Late log replaced current repository');
 hold='commit|tools/sdk';document.querySelector('.git-commit').click();await until(()=>pending.length,'Held detail request missing');
 check(pending.length,'Held detail missing');choose('Git 仓库','sdk');await until(()=>document.querySelector('.git-commit')?.textContent.includes('sdk commit'),'SDK after detail hold');hold='';pending.splice(0).forEach(finish=>finish());await selectCommit();await selectText('sdk');check(document.querySelector('.commit-metadata h3').textContent==='sdk detail','Late detail polluted shared hash cache');
 hold='diff|sdk';tick++;render();await until(()=>pending.length,'Held diff missing');choose('Git 仓库','tools/sdk');await until(()=>document.querySelector('.git-commit')?.textContent.includes('tools/sdk commit'),'Nested after diff hold');hold='';pending.splice(0).forEach(finish=>finish());await selectCommit();await selectText('tools/sdk');
 choose('Git 仓库','sdk');await until(()=>document.querySelector('.git-commit')?.textContent.includes('sdk commit'),'SDK before fetch');hold='fetch|sdk';button('↻ 刷新').click();await until(()=>pending.length,'Held fetch missing');check(requests.find(request=>request.route==='fetch').body.repository==='sdk','Fetch target missing');
 choose('Git 仓库','tools/sdk');await until(()=>document.querySelector('.git-commit')?.textContent.includes('tools/sdk commit'),'Switch during fetch');hold='';pending.splice(0).forEach(finish=>finish());await until(()=>!button('↻ 刷新').disabled,'Fetch did not finish');check(!visibleText(),'Old fetch displayed under new repository');choose('Git 仓库','sdk');await until(()=>visibleText().includes('sdk'),'Original repository fetch result not restored');
 button('文件').click();await until(()=>button('file.txt'),'Files unavailable');check(!visibleText(),'History fetch result displayed in files');button('↻ 刷新').click();await until(()=>requests.filter(request=>request.route==='fetch').length===2,'Main fetch missing');check(requests.filter(request=>request.route==='fetch')[1].body.repository===undefined||requests.filter(request=>request.route==='fetch')[1].body.repository==='','Files fetched selected subrepo');check(requests.filter(request=>request.route==='files').every(request=>!('repository' in request.query)),'Files inherited history repository');
 button('Git 日志').click();await until(()=>document.querySelector('[aria-label="Git 仓库"]').value==='sdk','Tab switch lost repo');check(!visibleText(),'Files result displayed in history');root.render(null);await pause();render();await until(()=>document.querySelector('[aria-label="Git 仓库"]')?.value==='sdk','Reload lost repository');window.reloadState=saved();
 repositories=repositories.map(entry=>entry.path==='sdk'?{...entry,available:false,reason:'仓库暂时不可访问'}:entry);tick++;render();await until(()=>saved().history.repository==='','Unavailable selected repo did not fall back');check(document.body.textContent.includes('已返回主仓库'),'Unavailable fallback notice missing');repositories=repositories.map(entry=>entry.path==='sdk'?{...entry,available:true}:entry);tick++;render();await until(()=>document.querySelector('option[value="sdk"]')?.disabled===false,'SDK not available again');choose('Git 仓库','sdk');await until(()=>saved().history.repository==='sdk','SDK selection after unavailable failed');
 repositories=repositories.filter(repository=>repository.path!=='sdk');complete=false;tick++;render();await until(()=>document.body.textContent.includes('扫描不完整'),'Incomplete discovery warning missing');check(saved().history.repository==='sdk','Incomplete discovery discarded saved repo');
 complete=true;tick++;render();await until(()=>saved().history.repository==='','Missing repo did not fall back');check(document.body.textContent.includes('已返回主仓库'),'Fallback notice missing');
 repositories=[repositories[0]];tick++;render();await until(()=>!document.querySelector('[aria-label="Git 仓库"]'),'Single repo still uses selector');check(document.querySelector('.git-repository-name')?.textContent.includes('project'),'Single repository label missing');await until(()=>document.querySelector('.git-commit')?.textContent.includes('main commit')&&document.querySelector('.git-history').getAttribute('aria-busy')==='false','Single repository log missing');
 document.querySelector('#result').textContent='PASS: 仓库 / 分支与分页重置 / 文本与图片隔离 / 延迟响应 / fetch 目标 / 标签与重载恢复 / 消失与扫描边界 / 单仓库';
}
}catch(error){document.querySelector('#result').textContent='FAIL: '+error.message;console.error(error);}
</script></html>
