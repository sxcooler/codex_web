<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/icon.svg"><title>执行过程折叠回归</title><div id="root"></div><output id="result" style="position:fixed;bottom:0;right:0;z-index:100;background:#111">RUNNING</output>
<script type="module">
const id='execution-test',epoch='execution-epoch',sources=[],full='完整输出\n'.repeat(8000);let outputReads=0;
const command={id:'command',type:'commandExecution',command:'pwsh -Command '+ 'long command '.repeat(30),status:'failed',exitCode:2,aggregatedOutput:full.slice(0,2048),outputDeferred:true,outputBytes:new TextEncoder().encode(full).length,outputChars:full.length};
const live={id:'live',type:'commandExecution',command:'npm test',status:'inProgress',aggregatedOutput:'开始运行'};
const activity=(id,kind)=>({id,type:'subAgentActivity',kind,agentThreadId:'child-thread',agentPath:'reviewer'});
const turn={id:'turn',status:'inProgress',items:[{id:'user',type:'userMessage',content:[{type:'text',text:'开始任务'}]},{id:'short',type:'reasoning',summary:['短思考摘要'],content:[]},activity('child-start','started'),command,activity('child-complete','completed'),{id:'long',type:'reasoning',summary:['长思考摘要'],content:['思考详情'.repeat(100)]},{id:'body',type:'agentMessage',text:'正文进度保持可见'},{id:'steer',type:'userMessage',content:[{type:'text',text:'用户插话'}]},live,activity('child-live','interacted'),{id:'reason-live',type:'reasoning',summary:[],content:[]},{id:'future',type:'futureTool',payload:'未知类型原文'}]};
let snapshot={thread:{id,name:'执行过程测试',turns:[{id:'failed',status:'failed',items:[{id:'oldcmd',type:'commandExecution',command:'old command',status:'failed',aggregatedOutput:'old failure'}]},turn]},phase:'WAITING_APPROVAL',activeTurnId:'turn',pending:[{requestId:'approval',method:'item/commandExecution/requestApproval',params:{itemId:'live',command:'npm test'}}],epoch,revision:0,syncCursor:epoch+':0'};
const response=data=>new Response(JSON.stringify(data)),check=(value,message)=>{if(!value)throw Error(message)},pause=()=>new Promise(r=>setTimeout(r,70));async function until(predicate,message){const end=Date.now()+12000;while(!predicate()){if(Date.now()>end)throw Error(message);await pause();}}
window.EventSource=class extends EventTarget{constructor(){super();sources.push(this);queueMicrotask(()=>this.dispatchEvent(new Event('ready')));}close(){this.closed=true;}};
window.fetch=async raw=>{const path=String(raw);if(path==='/api/auth/session')return response({authenticated:true,csrfToken:'test'});if(path==='/api/projects')return response({projects:[]});if(path==='/api/models')return response({data:[]});if(path.startsWith('/api/permission-modes'))return response({modes:[]});if(path==='/api/sessions')return response({data:[{id,name:'执行过程测试'}],nextCursor:null});if(path==='/api/sessions/'+id)return response(structuredClone(snapshot));if(path.includes('/status?'))return response({resync:false});if(path.endsWith('/open')||path.endsWith('/cancel-release')||path.endsWith('/release-on-leave'))return response({});if(path.endsWith('/output')){outputReads++;return response({output:full});}throw Error('Unexpected '+path);};
const visible=node=>!!node&&node.checkVisibility(),groups=()=>[...document.querySelectorAll('.execution-process')],button=(root,text)=>[...root.querySelectorAll('button')].find(node=>node.textContent===text);
const emit=patch=>{snapshot.revision++;snapshot.syncCursor=epoch+':'+snapshot.revision;sources.findLast(source=>!source.closed)?.dispatchEvent(new MessageEvent('change',{data:JSON.stringify({id:snapshot.syncCursor,threadId:id,kind:'item',revision:snapshot.revision,patch})}));};
history.replaceState(null,'','/sessions/'+id);
try{
 await import('/src/web/main.tsx');await until(()=>document.querySelector('.timeline')?.textContent.includes('正文进度保持可见'),'正文未加载');check(groups().length===3,'子 Agent 活动不应拆分连续执行过程');check(!groups()[0].open&&groups()[1].open&&groups()[2].open,'运行中外层展开，历史终态折叠');check(outputReads===0,'未展开输出提前读取');
 const unknown=document.querySelector('details.tool');check(unknown&&!unknown.closest('.execution-process')&&unknown.textContent.includes('未知类型原文'),'未知类型展示被改变');check(visible(document.querySelector('.approval')),'审批被折叠隐藏');check([...document.querySelectorAll('.notice')].some(node=>visible(node)&&node.textContent==='本轮执行失败'),'失败提示被隐藏');
 const group=groups()[1],running=groups()[2],records=[...group.querySelectorAll('.execution-records')];check(records.length===2&&!records.some(node=>node.open),'异常应打断机械记录且默认折叠');check(group.querySelector('.command-step .step-status')?.textContent==='命令退出码 2','非零退出码没有显式显示');check(group.querySelector('.message')?.textContent.includes('正文进度保持可见'),'原文进度未显示');check(!group.querySelector('.step-excerpt'),'折叠思考摘要仍占概览');
 records.forEach(node=>node.querySelector('summary').click());await until(()=>group.querySelectorAll('.execution-step').length===5,'展开记录缺少步骤');check([...group.querySelectorAll('.step-heading>span:first-child')].map(n=>n.textContent).join(',')==='思考,子 Agent,命令,子 Agent,思考','原始顺序被改变');
 const agent=[...group.querySelectorAll('.execution-step')].find(node=>node.querySelector('.step-heading>span')?.textContent==='子 Agent');check(agent.querySelector('code')?.textContent==='reviewer'&&agent.querySelector('.step-status')?.textContent==='启动','子 Agent 名称动作缺失');button(agent,'原始数据').click();await until(()=>agent.querySelector('pre')?.textContent.includes('child-thread'),'原始数据不可查');button(agent,'收起原始数据').click();
 const cmd=group.querySelector('.command-step');button(cmd,'查看输出').click();button(group,'查看详情').click();await until(()=>outputReads===1&&cmd.querySelector('pre:not(.command-source)')?.textContent===full,'按需输出未加载');check(button(group,'收起详情')?.getAttribute('aria-expanded')==='true','多个详情不能同时打开');
 const pre=cmd.querySelector('pre:not(.command-source)');pre.scrollTop=80;group.querySelector(':scope>summary').click();await until(()=>!group.open,'外层未收起');check(!visible(pre),'隐藏内容仍可见');button(cmd,'收起输出').focus();check(document.activeElement!==button(cmd,'收起输出'),'隐藏按钮可获取焦点');group.querySelector(':scope>summary').click();await until(()=>group.open,'外层无法重开');check(outputReads===1&&pre.scrollTop===80&&button(cmd,'收起输出'),'重开丢失命令缓存状态');
 const liveRecords=running.querySelector('.execution-records');check(!liveRecords.open&&liveRecords.textContent.includes('正在运行命令'),'运行中折叠摘要未显示真实状态');liveRecords.querySelector('summary').click();await until(()=>running.querySelector('.command-step'),'运行步骤缺失');const liveNode=running.querySelector('.command-step');button(liveNode,'查看输出').click();emit({delta:{turnId:'turn',itemId:'live',field:'aggregatedOutput',offset:live.aggregatedOutput.length,text:'新增输出'}});await until(()=>liveNode.textContent.includes('新增输出'),'SSE流式内容缺失');check(running.open&&liveRecords.open&&button(liveNode,'收起输出'),'增量重置内层展开');
 emit({item:{turnId:'turn',item:activity('child-live','completed'),completed:true}});await pause();check(groups().length===3&&liveRecords.open,'子 Agent 更新重置分组');emit({delta:{turnId:'turn',itemId:'reason-live',field:'summary',index:0,offset:0,text:'实时摘要'}});await until(()=>running.querySelector('.step-excerpt')?.textContent==='实时摘要','摘要SSE缺失');
 emit({turn:{id:'turn',status:'completed',items:[{...live,status:'completed',aggregatedOutput:'最终输出',exitCode:0}]},state:{phase:'IDLE',activeTurnId:null,pending:[],error:null}});await until(()=>liveNode.textContent.includes('最终输出')&&!running.open,'默认外层终态未收起或输出缺失');check(button(liveNode,'收起输出')&&liveRecords.open,'自动收起重置内部状态');running.querySelector(':scope>summary').click();await until(()=>running.open,'终态无法重开');emit({item:{turnId:'turn',item:activity('child-live','completed'),completed:true}});await pause();check(running.open&&button(liveNode,'收起输出'),'终态SSE补齐重置用户选择');check(!groups()[0].open,'历史终态被自动展开');check(document.documentElement.scrollWidth<=innerWidth,'页面横向溢出');
 document.querySelector('#result').textContent='PASS: 精简机械记录 / 原文说明 / 异常外显 / 审批 / 延迟输出 / SSE / 终态一次收起与手动状态';}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;console.error(e);}
</script></html>
