<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/icon.svg"><title>执行过程折叠回归</title><div id="root"></div><output id="result" style="position:fixed;bottom:0;right:0;z-index:100;background:#111">RUNNING</output>
<script type="module">
const id='execution-test',epoch='execution-epoch',sources=[],full='完整输出\n'.repeat(8000);let outputReads=0;
const command={id:'command',type:'commandExecution',command:'pwsh -Command '+ 'long command '.repeat(30),status:'completed',exitCode:1,aggregatedOutput:full.slice(0,2048),outputDeferred:true,outputBytes:new TextEncoder().encode(full).length,outputChars:full.length};
const live={id:'live',type:'commandExecution',command:'npm test',status:'inProgress',aggregatedOutput:'开始运行'};
const turn={id:'turn',status:'inProgress',items:[{id:'user',type:'userMessage',content:[{type:'text',text:'开始任务'}]},{id:'short',type:'reasoning',summary:['短思考摘要'],content:[]},command,{id:'long',type:'reasoning',summary:['长思考摘要'],content:['思考详情'.repeat(100)]},{id:'body',type:'agentMessage',text:'正文进度保持可见'},{id:'steer',type:'userMessage',content:[{type:'text',text:'用户插话'}]},live,{id:'future',type:'futureTool',payload:'未知类型原文'}]};
let snapshot={thread:{id,name:'执行过程测试',turns:[{id:'failed',status:'failed',items:[{id:'oldcmd',type:'commandExecution',command:'old command',status:'failed',aggregatedOutput:'old failure'}]},turn]},phase:'WAITING_APPROVAL',activeTurnId:'turn',pending:[{requestId:'approval',method:'item/commandExecution/requestApproval',params:{itemId:'live',command:'npm test'}}],epoch,revision:0,syncCursor:epoch+':0'};
const response=data=>new Response(JSON.stringify(data)),check=(value,message)=>{if(!value)throw Error(message)},pause=()=>new Promise(r=>setTimeout(r,70));async function until(predicate,message){const end=Date.now()+12000;while(!predicate()){if(Date.now()>end)throw Error(message);await pause();}}
window.EventSource=class extends EventTarget{constructor(){super();sources.push(this);queueMicrotask(()=>this.dispatchEvent(new Event('ready')));}close(){this.closed=true;}};
window.fetch=async raw=>{const path=String(raw);if(path==='/api/auth/session')return response({authenticated:true,csrfToken:'test'});if(path==='/api/projects')return response({projects:[]});if(path==='/api/models')return response({data:[]});if(path.startsWith('/api/permission-modes'))return response({modes:[]});if(path==='/api/sessions')return response({data:[{id,name:'执行过程测试'}],nextCursor:null});if(path==='/api/sessions/'+id)return response(structuredClone(snapshot));if(path.includes('/status?'))return response({resync:false});if(path.endsWith('/cancel-release')||path.endsWith('/release-on-leave'))return response({});if(path.endsWith('/output')){outputReads++;return response({output:full});}throw Error('Unexpected '+path);};
const visible=node=>!!node&&node.checkVisibility(),groups=()=>[...document.querySelectorAll('.execution-process')],button=(root,text)=>[...root.querySelectorAll('button')].find(node=>node.textContent===text);
const emit=patch=>{snapshot.revision++;snapshot.syncCursor=epoch+':'+snapshot.revision;sources.findLast(source=>!source.closed)?.dispatchEvent(new MessageEvent('change',{data:JSON.stringify({id:snapshot.syncCursor,threadId:id,kind:'item',revision:snapshot.revision,patch})}));};
history.replaceState(null,'','/sessions/'+id);
try{
 await import('/src/web/main.tsx');await until(()=>groups().length===3,'执行分组数量错误');check(groups().every(group=>!group.open),'运行中过程默认展开');check(!document.querySelector('.execution-step'),'折叠过程提前挂载正文');check(outputReads===0,'折叠过程提前读取输出');const unknown=document.querySelector('details.tool');check(unknown&&!unknown.closest('.execution-process')&&unknown.textContent.includes('未知类型原文'),'未知类型展示被改变或隐藏进执行组');
 check(visible(document.querySelector('.approval')),'审批被折叠隐藏');check([...document.querySelectorAll('.notice')].some(node=>visible(node)&&node.textContent==='本轮执行失败'),'失败提示被隐藏');
 const order=[...document.querySelectorAll('.timeline-content .message,.execution-process')].map(node=>node.matches('.execution-process')?'过程':node.textContent);check(order[1].includes('开始任务')&&order[2]==='过程'&&order[3].includes('正文进度保持可见')&&order[4].includes('用户插话')&&order[5]==='过程','分组改变消息顺序');
 const group=groups()[1],running=groups()[2];group.querySelector('summary').click();await until(()=>group.querySelectorAll('.execution-step').length===3,'步骤缺失');check(visible(group.querySelector('.step-excerpt'))&&group.textContent.includes('短思考摘要'),'短摘要需要额外展开');check(!group.querySelector('details'),'内层仍使用嵌套 accordion');check(outputReads===0,'外层展开提前读取输出');
 const cmd=group.querySelector('.command-step');button(cmd,'查看输出').click();button(group,'查看详情').click();await until(()=>outputReads===1&&cmd.querySelector('pre:not(.command-source)')?.textContent===full,'按需输出未加载');check(button(group,'收起详情')?.getAttribute('aria-expanded')==='true','详情与输出不能同时打开');
 const pre=cmd.querySelector('pre:not(.command-source)');pre.scrollTop=80;group.querySelector('summary').click();await until(()=>!group.open,'外层未收起');check(!visible(pre),'收起后内容仍可见');button(cmd,'收起输出').focus();check(document.activeElement!==button(cmd,'收起输出'),'隐藏内容仍可获取焦点');group.querySelector('summary').click();await until(()=>group.open,'外层未重开');check(button(cmd,'收起输出')?.getAttribute('aria-expanded')==='true'&&button(group,'收起详情')?.getAttribute('aria-expanded')==='true','外层重开重置内部状态');check(outputReads===1&&pre.scrollTop===80,'重开重新加载或丢失滚动位置');
 running.querySelector('summary').click();await until(()=>running.querySelector('.command-step'),'运行步骤缺失');const liveNode=running.querySelector('.command-step');check(button(liveNode,'查看输出')?.getAttribute('aria-expanded')==='false','运行中命令自动展开');button(liveNode,'查看输出').click();await pause();emit({delta:{turnId:'turn',itemId:'live',field:'aggregatedOutput',offset:live.aggregatedOutput.length,text:'新增输出'}});await until(()=>liveNode.textContent.includes('新增输出'),'流式内容缺失');check(running.open&&button(liveNode,'收起输出'),'增量重置展开状态');
 emit({turn:{id:'turn',status:'completed',items:[{...live,status:'completed',aggregatedOutput:'最终输出',exitCode:0}]},state:{phase:'IDLE',activeTurnId:null,pending:[],error:null}});await until(()=>liveNode.textContent.includes('最终输出'),'终态输出缺失');check(running.open&&button(liveNode,'收起输出'),'完成自动收起用户展开的内容');check(!groups()[0].open,'历史过程被自动展开');
 check(document.documentElement.scrollWidth<=window.innerWidth,'页面横向溢出');document.querySelector('#result').textContent='PASS: 默认折叠 / 正文插话顺序 / 审批失败外显 / 紧凑步骤 / 多项展开 / 状态缓存滚动保留 / 增量终态不自动开合';
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;console.error(e);}
</script></html>
