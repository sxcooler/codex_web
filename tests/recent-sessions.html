<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>最近会话刷新回归检查</title>
<!-- Run npm run dev, then open /tests/recent-sessions.html. Uses only fake API data. -->
<div id="root"></div>
<output id="result" style="position:fixed;bottom:0;right:0;z-index:100;background:#111;padding:8px">RUNNING</output>
<script type="module">
  const requests = [];
  const pending = [];
  const reply = (data, status = 200) => new Response(JSON.stringify(data), {status});
  window.fetch = async path => {
    requests.push(path);
    if (path === '/api/auth/session') return reply({authenticated:true, csrfToken:'test'});
    if (path === '/api/projects') return reply({projects:[]});
    if (path.startsWith('/api/sessions')) return new Promise(resolve => pending.push({path, resolve}));
    throw new Error('Unexpected API: ' + path);
  };
  const check = (value, message) => { if (!value) throw new Error(message); };
  async function until(predicate, message) {
    const deadline = Date.now() + 5000;
    while (!predicate()) {
      if (Date.now() > deadline) throw new Error(message);
      await new Promise(resolve => setTimeout(resolve, 20));
    }
  }
  const refresh = () => document.querySelector('button[aria-label="刷新最近会话"]');
  const more = () => [...document.querySelectorAll('nav.recent button')].find(b => b.textContent === '加载更多');
  const titles = () => [...document.querySelectorAll('nav.recent button[title]')].map(b => b.title).join(',');
  async function respond(data, status = 200) {
    await until(() => pending.length, 'Expected session request');
    pending.shift().resolve(reply(data, status));
    await until(() => refresh() && !refresh().disabled, 'Refresh control missing or stuck');
  }
  try {
    await import('/src/web/main.tsx');
    await respond({data:[{id:'archived',name:'待归档会话'}],nextCursor:'old cursor'});
    const draft = document.querySelector('textarea');
    const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;
    setter.call(draft, '保留未发送草稿');
    draft.dispatchEvent(new Event('input', {bubbles:true}));
    more().click();
    await respond({data:[{id:'older',name:'旧分页会话'}],nextCursor:'stale cursor'});
    check(titles() === '待归档会话,旧分页会话', 'Pagination must append');
    refresh().click();
    await until(() => refresh().disabled, 'Refresh must disable during loading');
    check(more().disabled, 'Pagination must disable during refresh');
    refresh().click();
    check(pending.length === 1, 'Repeated clicks must not duplicate requests');
    check(pending[0].path === '/api/sessions', 'Refresh must request first page');
    await respond({data:[{id:'new',name:'VS Code 新会话'}],nextCursor:'fresh cursor'});
    check(titles() === 'VS Code 新会话', 'Refresh must replace archived and paginated entries');
    check(document.querySelector('textarea') === draft && draft.value === '保留未发送草稿', 'Refresh must preserve current form');
    more().click();
    await until(() => pending.length, 'Expected next page');
    check(pending[0].path === '/api/sessions?cursor=fresh%20cursor', 'Pagination must use refreshed cursor');
    await respond({data:[{id:'new',name:'VS Code 新会话'},{id:'next',name:'下一页'}],nextCursor:null});
    check(titles() === 'VS Code 新会话,下一页', 'Pagination must deduplicate');
    refresh().click();
    await respond({error:'模拟刷新失败'}, 500);
    check(document.querySelector('[role="alert"]')?.textContent.includes('模拟刷新失败'), 'Failure must be visible');
    check(titles() === 'VS Code 新会话,下一页', 'Failure must preserve list');
    refresh().click();
    await respond({data:[],nextCursor:null});
    check(!document.querySelector('[role="alert"]'), 'Retry must clear error');
    check(document.querySelector('nav.recent').textContent.includes('暂无会话') && !more(), 'Empty refresh must clear list and cursor');
    check(requests.filter(path => path === '/api/projects').length === 1, 'Session refresh must not reload projects');
    check(requests.filter(path => path.startsWith('/api/auth/')).length === 1, 'Session refresh must not log in again');
    document.querySelector('#result').textContent = 'PASS: 新增 / 归档 / 分页 / 防重复 / 草稿 / 失败重试';
  } catch (error) {
    document.querySelector('#result').textContent = 'FAIL: ' + error.message;
    console.error(error);
  }
</script>
</html>
